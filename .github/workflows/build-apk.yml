name: APK derle

on:
  push:
    # claude/** de dahil: derlemenin main'e birleştirilmeyi beklemeden,
    # çalışıldığı dalda da APK üretmesi için.
    branches: [main, master, 'claude/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: JDK 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 20 kur
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # setup-java'nın hazır `cache: gradle` seçeneği burada KULLANILAMIYOR:
      # o, checkout anında bir Gradle dosyası bulup önbellek anahtarı üretmeye
      # çalışıyor, ama bizim android/ klasörümüz henüz üretilmemiş oluyor —
      # adım "No file ... matched" diye hata verip derlemeyi düşürüyor.
      # Bağımlılıkları bu yüzden doğrudan önbelleğe alıyoruz. Anahtar
      # package-lock.json'dan geliyor: Capacitor sürümü Android tarafındaki
      # bağımlılıkları da belirlediğinden, kilit değişmedikçe önbellek geçerli.
      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', '.github/workflows/build-apk.yml') }}
          restore-keys: gradle-${{ runner.os }}-

      # package-lock.json depoda: `npm ci` kilit dosyasındaki SÜRÜMLERİN
      # aynısını kurar, yani burada derlenen şey yerelde doğrulanan şeyle
      # birebir aynı olur (`npm install` sürümleri sessizce yükseltebilirdi).
      - name: npm bağımlılıklarını kur
        run: npm ci

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      # android/ klasörü bilerek depoya eklenmiyor: Capacitor'un KENDİ resmi
      # şablonundan her derlemede TAZE üretiliyor, üstüne de aşağıdaki iki
      # betikle (ikonlar + izinler) yamanıyor. Böylece elle taşınmış, zamanla
      # bayatlayan bir Gradle projesi taşımak zorunda kalmıyoruz.
      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Firebase yapılandırmasını yerleştir (push bildirimleri)
        run: bash scripts/copy_google_services.sh

      - name: Uygulama ikonlarını yerleştir
        run: bash scripts/copy_icons.sh

      - name: Gerekli izinleri (kamera/mikrofon/bildirim) ekle
        run: python3 scripts/patch_manifest.py

      # Gönderim ilerlemesi için kendi native eklentimiz: Capacitor'un yerel
      # bildirim eklentisi her güncellemede bildirimi silip yeniden yayınlıyor
      # (yerinde güncellenmiyor) ve ilerleme çubuğunu hiç desteklemiyor.
      - name: Native sınıfları kur (ilerleme + bildirim servisi)
        run: python3 scripts/install_native_plugin.py

      # Kendi FCM servisimiz uygulama modülünde derleniyor ama
      # firebase-messaging'i Capacitor'un push eklentisi `implementation`
      # olarak alıyor — Gradle bunu AKTARMIYOR, uygulama modülü
      # "cannot find symbol: RemoteMessage" ile derlenmiyor.
      - name: Gradle bağımlılığını yama (firebase-messaging)
        run: python3 scripts/patch_gradle.py

      - name: Web içeriğini senkronla
        run: npx cap sync android

      # Bildirim köprüsünü yalnızca DERLENEN kopyaya ekliyoruz; www/index.html
      # canlı sitedekiyle birebir aynı kalsın diye (bkz. scripts/inject_native_script.py).
      # Bu testler bir kez gerçekten yaşanan bir arızayı kilitliyor: enjeksiyon
      # betiği "zaten ekli mi?" denetimini dosya ADINA göre yapıyordu ve
      # index.html'e o adı anan bir yorum eklenince etiketi hiç koymadı —
      # köprü APK'ya girdi ama sayfaya yüklenmedi, bildirimler sessizce gitti.
      - name: Enjeksiyon betiğini sına
        run: python3 scripts/test_inject_native_script.py

      # Mesaj bildirimi id'si iki ayrı dilde elle yazılmış iki karma
      # fonksiyonundan geliyor (web köprüsü + native servis). Ayrışırlarsa
      # Android aynı mesaj için İKİ bildirim gösterir; bu sınama ikisini de
      # gerçek kaynaktan çıkarıp çalıştırarak karşılaştırıyor.
      - name: Bildirim id'lerini sına (native ↔ web)
        run: python3 scripts/test_bildirim_id.py

      # index.html'in başındaki yorum bloğu veritabanı kurallarının
      # kopyala-yapıştır kopyasını taşıyor. İkisi saparsa biri oradaki ESKİ
      # kuralları konsola yapıştırıp kapatılmış bir açığı yeniden açabilir.
      # Uyarı yazmak yetmiyor; sapma burada derlemeyi kırıyor.
      - name: Kural kopyasının aynı olduğunu sına
        run: python3 scripts/test_kurallar_ayni.py

      # Bildirimler eskiden birbirinin üstüne yazıyordu; artık sohbet başına
      # tek bildirimde BİRİKİYORLAR. Bunun doğrudan gözleneceği tek yer bir
      # telefon, o yüzden biriktirme kuralları Android'e dokunmayan saf
      # metotlara ayrıldı ve burada gerçek kaynaktan çıkarılıp koşuyor.
      - name: Biriken bildirim kurallarını sına
        run: python3 scripts/test_biriken_bildirim.py

      - name: Bildirim köprüsünü ekle
        run: python3 scripts/inject_native_script.py

      # Son kontrol: etiket gerçekten derlenen kopyada mı? Köprünün sessizce
      # eksik kaldığı bir APK bir daha üretilmesin.
      - name: Köprünün yüklendiğini doğrula
        run: |
          DOSYA=android/app/src/main/assets/public/index.html
          grep -q '<script src="meridyen-native.js"></script>' "$DOSYA" \
            || { echo "HATA: bildirim köprüsü etiketi derlenen index.html'de yok"; exit 1; }
          test -f android/app/src/main/assets/public/meridyen-native.js \
            || { echo "HATA: meridyen-native.js kopyalanmamış"; exit 1; }
          PAKET=$(python3 -c "import json;print(json.load(open('capacitor.config.json'))['appId'].replace('.','/'))")
          test -f "android/app/src/main/java/$PAKET/MeridyenIlerleme.java" \
            || { echo "HATA: native ilerleme eklentisi kopyalanmamış"; exit 1; }
          grep -q 'registerPlugin(MeridyenIlerleme.class)' "android/app/src/main/java/$PAKET/MainActivity.java" \
            || { echo "HATA: native eklenti MainActivity'de kayıtlı değil"; exit 1; }
          # Bildirim yığını: kapalıyken gelen push'u çizen servis ve onun
          # dayandığı ortak sınıf. Biri eksik kalırsa uygulama kapalıyken
          # hiçbir bildirim görünmez ve bu dışarıdan hiç belli olmaz.
          for SINIF in MeridyenBildirimler MeridyenMesajServisi MeridyenNobet MeridyenKayanEkran MeridyenBildirimSil; do
            test -f "android/app/src/main/java/$PAKET/$SINIF.java" \
              || { echo "HATA: $SINIF.java kopyalanmamış"; exit 1; }
          done
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "$(python3 -c "import json;print(json.load(open('capacitor.config.json'))['appId'])").MeridyenMesajServisi" "$MANIFEST" \
            || { echo "HATA: FCM servisi manifestte tanımlı değil"; exit 1; }
          # Capacitor'un kendi servisi kalmamalı: aynı intent-filter'a sahip
          # iki servis olursa FCM teslimi belirsiz sırayla birine gider.
          grep -q 'tools:node="remove"' "$MANIFEST" \
            || { echo "HATA: Capacitor'un FCM servisi kaldırılmamış"; exit 1; }
          grep -q 'default_notification_channel_id' "$MANIFEST" \
            || { echo "HATA: varsayılan bildirim kanalı manifestte yok"; exit 1; }
          grep -q 'com.google.firebase:firebase-messaging' android/app/build.gradle \
            || { echo "HATA: firebase-messaging uygulama modülüne eklenmemiş"; exit 1; }
          # Kayan ekran (PiP): manifest bayrağı olmadan enterPictureInPictureMode
          # sessizce başarısız olur, düğme hiçbir şey yapmaz.
          grep -q 'android:supportsPictureInPicture="true"' "$MANIFEST" \
            || { echo "HATA: kayan ekran manifestte açık değil"; exit 1; }
          # PiP'te pencere yeniden boyutlanıyor; configChanges bunları
          # karşılamazsa activity yeniden yaratılır ve GÖRÜŞME DÜŞER.
          for D in screenSize screenLayout smallestScreenSize; do
            grep -q "$D" "$MANIFEST" \
              || { echo "HATA: configChanges içinde $D yok, kayan ekranda görüşme düşer"; exit 1; }
          done
          ANA="android/app/src/main/java/$PAKET/MainActivity.java"
          for GERI in onUserLeaveHint onPictureInPictureModeChanged; do
            grep -q "$GERI" "$ANA" \
              || { echo "HATA: MainActivity'de $GERI yok, kayan ekran çalışmaz"; exit 1; }
          done
          # Arka plan nöbeti: servis + türü + izni birlikte olmalı.
          grep -q 'android:foregroundServiceType="specialUse"' "$MANIFEST" \
            || { echo "HATA: nöbet servisinin ön plan türü tanımlı değil"; exit 1; }
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST" \
            || { echo "HATA: ön plan servisi izni eksik"; exit 1; }
          # Bildirim kaydırılıp atılınca biriken satırları unutan alıcı.
          # Olmazsa kullanıcının kapattığı mesajlar bir sonraki bildirimde
          # geri gelir — atılan bildirim dirilmiş gibi görünür.
          grep -q 'MeridyenBildirimSil' "$MANIFEST" \
            || { echo "HATA: bildirim silme alıcısı manifestte yok"; exit 1; }
          # Açılış ekranı: şablonun jenerik splash.png'leri yönelim/yoğunluk
          # klasörlerine de kopyalanıyor ve Android daha ÖZEL olanı seçtiği
          # için markalı olanı gölgeliyorlardı. Hiç kalmadığını doğruluyoruz.
          test -f android/app/src/main/res/drawable/splash.xml \
            || { echo "HATA: markalı açılış ekranı yok"; exit 1; }
          if find android/app/src/main/res -name 'splash.png' | grep -q .; then
            echo "HATA: şablonun jenerik splash.png'leri duruyor, markalı ekranı gölgeler"
            find android/app/src/main/res -name 'splash.png'
            exit 1
          fi
          echo "köprü, bildirim yığını, kayan ekran, nöbet ve açılış ekranı doğrulandı."

      - name: APK derle (debug imzalı — doğrudan telefona kurulabilir)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: meridyen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
